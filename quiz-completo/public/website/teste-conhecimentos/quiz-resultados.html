<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados do Quiz</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

    <style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Open+Sans:wght@300;400;500&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        opacity: 0;
        pointer-events: none;
        transition: opacity .15s ease-in-out;

        font-family: 'Open Sans', sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
        background: #0c0c0c; /* Fundo Principal Escuro */
        color: #f5f5f5; /* Texto principal claro */
    }

    body.loaded {
        opacity: 1;
        pointer-events: auto;
    }

    /* HEADER */
    header {
        width: 100%;
        background: #1a1a1a; /* Fundo Secundário */
        color: white;
        padding: 14px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        border-radius: 8px;
        border-bottom: 1px solid #c6a664;
    }

    header h2 {
        font-family: 'Cinzel', serif;
        color: #c6a664; /* Destaque em Ouro */
        margin: 0;
        font-weight: 600;
    }

    /* BOTÃO LOGOUT */
    .btn-logout {
        background: #991b1b; /* Vermelho sóbrio */
        border: none;
        padding: 8px 14px;
        color: white;
        font-size: 14px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn-logout:hover {
        background: #7f1d1d;
    }

    h1 {
        font-family: 'Cinzel', serif;
        text-align: center;
        margin-bottom: 10px;
        margin-top: 25px;
        color: #c6a664; /* Destaque em Ouro */
        font-size: 32px;
    }

    #finalizado {
        text-align: center;
        font-size: 28px;
        margin-bottom: 25px;
        font-weight: 700;
        color: #f5f5f5;
        font-family: 'Cinzel', serif;
    }

    /* CONTAINER PRINCIPAL DOS GRÁFICOS (Grid) */
    .results-grid {
        display: flex;
        flex-wrap: wrap; 
        justify-content: center;
        gap: 20px;
        margin-bottom: 35px;
    }

    .chart-container {
        /* Largura ajustada para caber lado a lado */
        width: 100%;
        max-width: 400px; 
        
        background: #1a1a1a; /* Fundo Secundário */
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 0 15px rgba(0,0,0,0.4);
        border: 1px solid #c6a664;
    }
    
    .chart-container h3 {
        color: #f5f5f5;
        margin-bottom: 15px;
        font-family: 'Open Sans', sans-serif;
    }

    /* CAIXA DE MENSAGEM DE DESEMPENHO */
    #mensagem {
        font-size: 20px;
        font-weight: bold;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
        margin-top: 35px;
        border: 2px solid; 
    }

    /* CORES DA MENSAGEM */
    .excelente {
        background-color: #334e32;
        color: #c8e6c9; 
        border-color: #4caf50;
    }

    .mediano {
        background-color: #4d442c;
        color: #fff8e1;
        border-color: #ffc107;
    }

    .fraco {
        background-color: #7f3232;
        color: #ffebee;
        border-color: #f44336;
    }

    /* BOTÃO VOLTAR */
    .btn-voltar {
        display: block;
        margin: 30px auto;
        text-decoration: none;
        text-align: center;
        padding: 14px 25px;
        background: #c6a664; /* Ouro/Âmbar como ação principal */
        color: #1a1a1a;
        font-size: 18px;
        border-radius: 10px;
        font-weight: bold;
        transition: 0.2s ease-in-out;
        width: 260px;
    }

    .btn-voltar:hover {
        background: #dfc884;
    }
    
    /* Media Query para telas menores */
    @media (max-width: 600px) {
        .chart-container {
            max-width: 100%;
        }
    }
    </style>
</head>

<body>

<header>
    <h2>Resultados do Quiz</h2>
    <button id="logoutBtn" class="btn-logout">Sair</button>
</header>

<h1>Resultados</h1>

<div id="finalizado">Quiz finalizado!</div>

<div class="results-grid">
    
    <div class="chart-container">
        <h3 style="text-align:center;">Acertos e Erros</h3>
        <canvas id="barra"></canvas>
    </div>

    <div class="chart-container">
        <h3 style="text-align:center;">Percentuais</h3>
        <canvas id="pizza"></canvas>
        <div id="mensagem"></div>
    </div>

</div> <a href="/website/teste-conhecimentos/teste-conhecimentos.html" class="btn-voltar">
    Voltar para a lista de quizzes
</a>

<script>

    // ============================
    // 1) VALIDAR SESSÃO
    // ============================
    async function validarSessao() {
        try {
            const res = await fetch("/usuario/sessao");

            if (res.status === 401) {
                window.location.href = "/website/login/login.html";
                return;
            }

            document.body.classList.add("loaded");

        } catch (err) {
            console.error("Erro ao validar sessão:", err);
            window.location.href = "/website/login/login.html";
        }
    }

    validarSessao();


    // ============================
    // 2) BOTÃO DE LOGOUT
    // ============================
    document.getElementById("logoutBtn").onclick = async () => {
        try {
            await fetch("/usuario", { method: "DELETE" });
        } catch (e) {}

        window.location.href = "/index.html";
    };


    // ============================
    // 3) CARREGAR RESULTADOS
    // ============================
    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const response = await fetch("/resposta/resultado");
            const data = await response.json();

            const {
                totalAcertos,
                totalErros,
                percentualAcertos,
                percentualErros,
                mensagemDesempenho
            } = data;

            const msg = document.getElementById("mensagem");
            msg.textContent = mensagemDesempenho;

            if (percentualAcertos >= 80) {
                msg.classList.add("excelente");
            } else if (percentualAcertos >= 50) {
                msg.classList.add("mediano");
            } else {
                msg.classList.add("fraco");
            }

            // cores
            const corAcertos = "#184e77"; /* Azul marinho (padronizado com btnProxima) */
            const corErros = "#b91c1c";
            
            // cores para o gráfico
            const corChartAcertos = "#c6a664"; /* Ouro para o gráfico */
            const corChartErros = "#991b1b"; /* Vermelho escuro para o gráfico */

            // barras
            new Chart(document.getElementById("barra"), {
                type: "bar",
                data: {
                    labels: ["Acertos", "Erros"],
                    datasets: [{
                        label: "Quantidade",
                        data: [totalAcertos, totalErros],
                        backgroundColor: [corChartAcertos, corChartErros]
                    }]
                },
                plugins: [ChartDataLabels],
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display:false
                        },
                        datalabels: {
                            color: "#fff",
                            anchor: "end",
                            align: "top",
                            font: { weight: "bold", size: 15 },
                            formatter: (value, ctx) =>
                                ctx.chart.data.labels[ctx.dataIndex] === "Acertos"
                                    ? `${totalAcertos} acertos`
                                    : `${totalErros} erros`
                        }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            ticks: { color: "#f5f5f5" }, /* Corrigido para texto claro */
                            grid: { color: 'rgba(245, 245, 245, 0.1)' } /* Linhas leves */
                        },
                        x: { 
                            ticks: { color: "#f5f5f5" }, /* Corrigido para texto claro */
                            grid: { color: 'rgba(245, 245, 245, 0.1)' }
                        }
                    }
                }
            });

            // pizza
            new Chart(document.getElementById("pizza"), {
                type: "pie",
                data: {
                    labels: ["% Acertos", "% Erros"],
                    datasets: [{
                        data: [percentualAcertos, percentualErros],
                        backgroundColor: [corChartAcertos, corChartErros]
                    }]
                },
                plugins: [ChartDataLabels],
                options: {
                    responsive: true,
                    plugins: {
                        datalabels: {
                            color: "#1a1a1a", /* Corrigido para texto escuro no gráfico claro (ouro) */
                            font: { weight: "bold", size: 16 },
                            formatter: v => v + "%"
                        }
                    },
                    legend: {
                        labels: {
                            color: '#f5f5f5' /* Corrigido para texto claro na legenda */
                        }
                    }
                }
            });

        } catch (error) {
            console.error("Erro ao carregar resultados:", error);
        }
    });

</script>

</body>
</html>
