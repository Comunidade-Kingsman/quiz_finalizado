<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Testes de Conhecimentos</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Open+Sans:wght@300;400;500&display=swap');

        /* Impede que header passe do tamanho da página */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* A página começa invisível até a sessão ser validada */
        body {
            opacity: 0;
            pointer-events: none;
            transition: opacity .15s ease-in-out;
            background: #0c0c0c;
            color: #f5f5f5;
            font-family: 'Open Sans', sans-serif;
        }

        body.loaded {
            opacity: 1;
            pointer-events: auto;
        }

        /* HEADER */
    header {
      width: 100vw; 
      background: #1a1a1a;
      color: white;
      padding: 14px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #c6a664;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      position: sticky; 
      top: 0;
      left: 0;
      z-index: 1000;
      box-sizing: border-box; 
    }

        header h2 {
            font-family: 'Cinzel', serif;
            color: #c6a664;
            margin: 0;
            font-weight: 600;
        }

        .btn-logout {
            background: #991b1b;
            border: none;
            padding: 8px 14px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-logout:hover {
            background: #7f1d1d;
        }

        h1 {
            text-align: start;
            margin-left: 240px;
            margin-top: 30px;
            font-size: 32px;
            font-weight: 700;
            color: #c6a664;
            text-shadow: none;
        }

        .quiz-container {
            max-width: 900px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); /*autofit para responsividade */
            gap: 20px;
        }

        .quiz-card {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: 0.25s;
            border-left: 6px solid #c6a664;
        }

        .quiz-card:hover {
            transform: translateY(-4px);
            background: #262626;
            box-shadow: 0 6px 14px rgba(0,0,0,0.3);
        }

        .quiz-title {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: bold;
            color: #c6a664;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quiz-desc {
            font-family: 'Open Sans', sans-serif;
            font-size: 14px;
            color: #bdbdbd;
        }

        .icon {
            font-size: 22px;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <h2>Testes de Conhecimentos</h2>

        <button class="btn-logout" id="logoutBtn">Sair</button>
    </header>


    <h1>Selecione um Quiz</h1>

    <div id="quizList" class="quiz-container">Carregando quizzes...</div>

    <script>

    // 1) Checar sessão (utiliza GET no endpoint /usuario/sessao)

    async function checarSessao() {
        try {
            const res = await fetch("/usuario/sessao");
            
            if (res.status === 401) { //401 é não autorizado
                // Redireciona ANTES de mostrar qualquer coisa
                window.location.href = "/website/login/login.html";
                return;
            }

            // se a sessão for válida,  revela a página
            document.body.classList.add("loaded");

        } catch (err) { // javascript fornece o objeto err automaticamente
            console.error("Erro na checagem de sessão:", err);
            window.location.href = "/website/login/login.html";
        }
    }

    // Executa imediatamente
    checarSessao();


    // 2) Logout (método DELETE no endpoint /usuario)

    document.getElementById("logoutBtn").onclick = async () => { //define o que ocorre ao clicar no botão
        try {
            await fetch("/usuario", { method: "DELETE" }); //requisita um delete no backend, encerrando a sessão
            window.location.href = "/index.html";
        } catch (err) {
            window.location.href = "/index.html";
        }
    };

    // 3) Carregar lista de quizzes
    fetch('/quiz') //GET no endpoint /quiz
        .then(res => res.json()) //converte a resposta em JSON para objeto JS
        .then(quizzes => { //quizzes é um array de objetos que veio do backend (model)
            const container = document.getElementById('quizList'); // guarda a lista de quiz que será exibida
            container.innerHTML = '';

            if (!Array.isArray(quizzes) || quizzes.length === 0) {
                container.innerHTML = "<p>Nenhum quiz encontrado.</p>";
                return;
            }

            quizzes.forEach(q => { //pra cada quiz cria um card (div) com nome e descrição que vieram do banco de dados
                const card = document.createElement('div');
                card.className = 'quiz-card';

                card.innerHTML = `
                    <div class="quiz-title">
                        <span class="icon"></span> 
                        ${q.nome}
                    </div>
                    <div class="quiz-desc">${q.descricao}</div>
                `;

                card.onclick = async () => {//tonar o cartão clicável
                    try {
                        const res = await fetch(`/quiz/selecionar/${q.id_quiz}`); 
                        //backend recebe a requisição -> função iniciarQuiz (no controller) é iniciada -> função salva o id do quiz na sessão do servidor
                        if (!res.ok) {
                            const erro = await res.json();
                            alert("Erro: " + erro.msg); //falha do fetch
                            return;
                        }

                        await res.json();

                        window.location.href = `/website/teste-conhecimentos/quiz-perguntas.html`;

                    } catch (e) { //falha inesperada, o usuario recebe a msg de erro
                        console.error(e);
                        alert("Erro ao selecionar quiz.");
                    }
                };

                container.appendChild(card); //pega o card que está guardado e transforma em elemento visual "filho" do container
            });
        })
        .catch(err => { //não consegue acessar a lista de quizzes
            console.error(err);
            document.getElementById('quizList').innerHTML =
                "<p>Erro ao carregar quizzes.</p>";
        });
    </script>

</body>
</html>
